name: Daily Tactical Pipeline Run

on:
  schedule:
    # 台灣時間週一至週五 14:30 (UTC 06:30)
    - cron: '30 6 * * 1-5'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Inspect Cloud Secret Meta
        env:
          KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -c "import os; k=os.environ.get('KEY',''); print('=== CLOUD SECRET ==='); print('長度:', len(k)); print('前四碼:', k[:4]); print('後四碼:', k[-4:])"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance xgboost scikit-learn google-genai requests pytest anyio

      - name: Run Central Tactical Pipeline (Step 1~6)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python src/main.py
